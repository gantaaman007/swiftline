<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swiftline my money</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F7FB; color: #0B1B33; font-family: Inter, system-ui, sans-serif; overflow: hidden">

<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.02em">My money</span>
<span style="font-size: 14px; color: #55657E">Your money in each currency. Add another currency whenever you need it.</span>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-weight: 600; font-size: 17px">Your currencies</span>
<div style="background: #FFFFFF; border: 1px solid #E1E7F2; border-radius: 18px; display: flex; flex-direction: column">
<sc-for list="{{owned}}" as="t" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #EEF1F7">
<span style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; background: {{t.bg}}; color: {{t.fg}}">{{t.code}}</span>
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 15px">{{t.name}}</span><span style="font-size: 13px; color: #55657E">{{t.code}}</span></div>
<span style="font-weight: 600; font-size: 15px">{{t.balance}}</span>
</div>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-weight: 600; font-size: 17px">Add another currency</span>
<input type="text" aria-label="Search currencies" placeholder="Search currencies" style="box-sizing: border-box; height: 48px; border-radius: 14px; border: 1px solid #D5DCEB; background: #FFFFFF; padding: 0 16px; font-size: 15px; font-family: inherit; color: #0B1B33">
<div style="background: #FFFFFF; border: 1px solid #E1E7F2; border-radius: 18px; display: flex; flex-direction: column">
<sc-for list="{{available}}" as="a" hint-placeholder-count="7">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #EEF1F7">
<span style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; background: {{a.bg}}; color: {{a.fg}}">{{a.code}}</span>
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 15px">{{a.name}}</span><span style="font-size: 13px; color: #55657E">{{a.code}}</span></div>
<button onClick="{{a.toggle}}" style="min-width: 76px; min-height: 44px; border-radius: 12px; border: 1px solid {{a.border}}; background: {{a.btnBg}}; color: {{a.btnFg}}; font-weight: 600; font-size: 14px; cursor: pointer">{{a.label}}</button>
</div>
</sc-for>
</div>
<span style="font-size: 12px; color: #55657E">Balances shown are illustrative.</span>
</div>

</div>

<div style="flex: 0 0 auto; display: flex; justify-content: space-around; align-items: center; padding: 8px 12px 28px; background: #FFFFFF; border-top: 1px solid #E1E7F2">
<a href="Home.dc.html" style="min-width: 56px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500; color: #55657E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#55657E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>Home</a>
<a href="Wallet.dc.html" style="min-width: 56px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: #2F5BFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F5BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12h2"/></svg>Wallet</a>
<a href="Send.dc.html" style="min-width: 56px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500; color: #55657E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#55657E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Send</a>
<a href="Track.dc.html" style="min-width: 56px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500; color: #55657E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#55657E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Activity</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { added: { GBP: true } };
}
renderVals() {
const base = [
{ code: 'USD', name: 'US Dollar', bg: '#DCE6FF', fg: '#1D3FC0', balance: '1,200.00' },
{ code: 'EUR', name: 'Euro', bg: '#E0F2EC', fg: '#0B6B4D', balance: '640.00' },
{ code: 'INR', name: 'Indian Rupee', bg: '#FFE9D2', fg: '#9A3F00', balance: '36,500.00' }
];
const more = [
{ code: 'GBP', name: 'British Pound', bg: '#F3E3FF', fg: '#6B21A8' },
{ code: 'MXN', name: 'Mexican Peso', bg: '#E2F5E7', fg: '#1F6B34' },
{ code: 'PHP', name: 'Philippine Peso', bg: '#DDEBFF', fg: '#1E4F9A' },
{ code: 'NGN', name: 'Nigerian Naira', bg: '#DDF5E3', fg: '#14693A' },
{ code: 'CAD', name: 'Canadian Dollar', bg: '#FFE1E1', fg: '#9B1C1C' },
{ code: 'AED', name: 'UAE Dirham', bg: '#F1EADD', fg: '#6A4A12' },
{ code: 'BRL', name: 'Brazilian Real', bg: '#E1F6D8', fg: '#2B6A12' }
];
const added = this.state.added;
const owned = base.concat(more.filter((m) => added[m.code]).map((m) => ({ ...m, balance: '0.00' })));
const available = more.map((m) => {
const on = !!added[m.code];
return {
...m,
label: on ? 'Added' : 'Add',
btnBg: on ? '#E3F4EC' : '#2F5BFF',
btnFg: on ? '#0B6B4D' : '#FFFFFF',
border: on ? '#B9E2D0' : '#2F5BFF',
toggle: () => this.setState({ added: { ...added, [m.code]: !on } })
};
});
return { owned, available };
}
}
</script>
</body>
</html>
