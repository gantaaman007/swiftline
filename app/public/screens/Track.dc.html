<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swiftline transfer tracking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F7FB; color: #0B1B33; font-family: Inter, system-ui, sans-serif; overflow: hidden">

<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Home.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #DCE3F0; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B1B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
<span style="font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.02em">Transfer status</span>
</div>

<div style="background: #0B1B33; color: #FFFFFF; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 14px; color: #B8C4DA">To Ravi K.</span><span style="padding: 4px 10px; border-radius: 999px; background: {{pillBg}}; color: {{pillFg}}; font-weight: 600; font-size: 12px">{{pillText}}</span></div>
<span style="font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 32px">{{sendText}}</span>
<span style="font-size: 15px; color: #7FE3BC; font-weight: 600">{{getText}}</span>
</div>

<div style="background: #FFFFFF; border: 1px solid #E1E7F2; border-radius: 20px; padding: 20px; display: flex; flex-direction: column">

<sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
<div style="display: flex; gap: 14px">
<div style="display: flex; flex-direction: column; align-items: center"><span style="{{s.circle}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: {{s.checkDisplay}}"><path d="M5 12l5 5 9-10"/></svg></span><span style="width: 2px; flex: 1 1 auto; min-height: 28px; background: {{s.line}}; display: {{s.lineDisplay}}"></span></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding-bottom: {{s.pad}}"><span style="font-weight: 600; font-size: 15px; color: {{s.titleColor}}">{{s.title}}</span><span style="font-size: 13px; color: #55657E">{{s.sub}}</span></div>
</div>
</sc-for>

</div>

<div style="background: #E8EEFF; border-radius: 16px; padding: 14px 16px; font-size: 13px; line-height: 1.5; color: #1B2E55">A receipt is created when settlement completes. You and the regulator can verify it without exposing other users.</div>

<span style="font-size: 13px; color: #C0392B">{{errText}}</span>

</div>

<div style="flex: 0 0 auto; padding: 12px 20px 32px; background: #FFFFFF; border-top: 1px solid #E1E7F2; display: flex; gap: 10px">
<a href="Home.dc.html" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 16px; background: #FFFFFF; border: 1px solid #D5DCEB; font-weight: 600; font-size: 15px">Back to home</a>
<a href="Send.dc.html" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 16px; background: #2F5BFF; color: #FFFFFF; font-weight: 600; font-size: 15px">Send another</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
async load() {
const sw = this.sw;
await sw.refresh();
sw.settling = sw.settling || {};
const esc = sw.escrow();
const t = esc.find((x) => x.cid === sw.flow.transferCid) || esc[esc.length - 1];
if (t && !sw.settling[t.cid]) {
sw.settling[t.cid] = true;
setTimeout(async () => {
try { await sw.api('settle', { transferCid: t.cid }); await sw.refresh(); sw.error = ''; }
catch (e) { sw.error = e.message; sw.settling[t.cid] = false; }
this.setState({});
}, 1800);
}
}
renderVals() {
const sw = this.sw, fmt = sw.fmt;
const esc = sw.escrow();
const t = esc.find((x) => x.cid === sw.flow.transferCid) || esc[esc.length - 1];
const rec = sw.receipts()[0];
let state = 'none', a = null;
if (t) { state = 'progress'; a = t.args; } else if (rec) { state = 'done'; a = rec.args; }
const doneCount = state === 'done' ? 5 : state === 'progress' ? 3 : 0;
const activeIdx = state === 'progress' ? 3 : -1;
const defs = [
['Quote locked', 'Rate and fee fixed for this transfer'],
['Checks passed', 'Identity, limits, and screening'],
['Funds held in escrow', 'Your USD token is locked by the contract'],
['Settling on Canton', 'Debit and credit complete together'],
['Paid out to Ravi', 'Bank account ending 4821']
];
const steps = defs.map((d, i) => {
const done = i < doneCount, active = i === activeIdx;
const nextDone = i + 1 < doneCount, nextActive = i + 1 === activeIdx;
return {
title: d[0], sub: d[1],
circle: done ? 'width: 28px; height: 28px; border-radius: 50%; background: #0B7A5A; display: flex; align-items: center; justify-content: center'
: 'width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; border: 3px solid ' + (active ? '#2F5BFF' : '#D5DCEB') + '; box-sizing: border-box',
checkDisplay: done ? 'block' : 'none',
line: done && nextDone ? '#0B7A5A' : done && nextActive ? '#C7D3F5' : '#D5DCEB',
lineDisplay: i === defs.length - 1 ? 'none' : 'block',
pad: i === defs.length - 1 ? '0' : '18px',
titleColor: active ? '#1D3FC0' : (!done ? '#55657E' : '#0B1B33')
};
});
const delivered = state === 'done';
return {
steps,
pillText: delivered ? 'Delivered' : state === 'progress' ? 'In progress' : 'No transfer',
pillBg: delivered ? '#0B7A5A' : '#16294A', pillFg: delivered ? '#FFFFFF' : '#9DB6FF',
sendText: a ? fmt(a.sendAmount) + ' USD' : '0.00 USD',
getText: a ? (delivered ? 'Ravi received ' : 'Ravi receives ') + fmt(a.receiveAmount) + ' ' + a.toCurrency : 'Send money to see status',
errText: sw.error || ''
};
}
}
</script>
</body>
</html>
