<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swiftline rate alerts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.cta:hover{background:#1D3FC0 !important}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F7FB; color: #0B1B33; font-family: Inter, system-ui, sans-serif; overflow: hidden">

<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Home.dc.html" aria-label="Back to home" style="width: 52px; height: 52px; border-radius: 16px; border: 2px solid #D5DCEB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B1B33" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
<span style="font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.02em">Rate alerts</span>
</div>

<p style="margin: 0; font-size: 19px; line-height: 1.5; color: #44546D">Tell us the rate you want. We will let you know when it is reached, so you can send when it is best for Ravi.</p>

<div style="background: #FFFFFF; border: 2px solid #E1E7F2; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; color: #44546D">Sending to India. Today</span>
<span style="font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 26px">1 USD = 83.00 INR</span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-weight: 600; font-size: 20px">Alert me when 1 USD reaches</span>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<button onClick="{{down}}" aria-label="Lower the target rate" style="width: 68px; height: 68px; border-radius: 18px; border: 2px solid #D5DCEB; background: #FFFFFF; font-size: 34px; font-weight: 700; color: #0B1B33; cursor: pointer">-</button>
<div style="flex: 1 1 0; min-width: 0; text-align: center; font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 34px">{{targetText}}<span style="font-size: 20px; color: #44546D"> INR</span></div>
<button onClick="{{up}}" aria-label="Raise the target rate" style="width: 68px; height: 68px; border-radius: 18px; border: 2px solid #D5DCEB; background: #FFFFFF; font-size: 34px; font-weight: 700; color: #0B1B33; cursor: pointer">+</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-weight: 600; font-size: 20px">How should we tell you?</span>
<sc-for list="{{channels}}" as="c" hint-placeholder-count="2">
<button onClick="{{c.pick}}" style="min-height: 60px; border-radius: 16px; border: 2px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-weight: 700; font-size: 19px; cursor: pointer; text-align: left; padding: 0 20px">{{c.label}}</button>
</sc-for>
</div>

<div style="background: #E8EEFF; border-radius: 16px; padding: 14px 16px; font-size: 16px; line-height: 1.5; color: #1B2E55">{{summary}} Rates shown are samples.</div>

</div>

<div style="flex: 0 0 auto; padding: 12px 20px 32px; background: #FFFFFF; border-top: 2px solid #E1E7F2">
<a class="cta" href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 64px; border-radius: 18px; background: #2F5BFF; color: #FFFFFF; font-weight: 700; font-size: 20px">Turn on alert</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { target: 84, channel: 'sms' };
}
renderVals() {
const chans = [
{ id: 'sms', label: 'Text message', word: 'text message' },
{ id: 'app', label: 'Notification on my phone', word: 'phone notification' }
];
const t = this.state.target;
const cur = chans.find((c) => c.id === this.state.channel) || chans[0];
return {
targetText: t.toFixed(2),
down: () => this.setState({ target: Math.max(70, Math.round((t - 0.25) * 100) / 100) }),
up: () => this.setState({ target: Math.round((t + 0.25) * 100) / 100 }),
channels: chans.map((c) => {
const on = c.id === this.state.channel;
return {
label: c.label,
bg: on ? '#2F5BFF' : '#FFFFFF',
fg: on ? '#FFFFFF' : '#0B1B33',
border: on ? '#2F5BFF' : '#D5DCEB',
pick: () => this.setState({ channel: c.id })
};
}),
summary: 'We will send a ' + cur.word + ' when 1 USD is worth ' + t.toFixed(2) + ' INR or more.'
};
}
}
</script>
</body>
</html>
