<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swiftline how they receive it</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.cta:hover{background:#1D3FC0 !important}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F7FB; color: #0B1B33; font-family: Inter, system-ui, sans-serif; overflow: hidden">

<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Send.dc.html" aria-label="Back to send" style="width: 52px; height: 52px; border-radius: 16px; border: 2px solid #D5DCEB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B1B33" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
<span style="font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.02em">How will Ravi get it?</span>
</div>

<p style="margin: 0; font-size: 19px; line-height: 1.5; color: #44546D">Choose the way that is easiest for Ravi. You can change this for each transfer.</p>

<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{methods}}" as="m" hint-placeholder-count="3">
<button onClick="{{m.pick}}" style="text-align: left; box-sizing: border-box; border-radius: 20px; border: 3px solid {{m.border}}; background: {{m.bg}}; padding: 18px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; color: #0B1B33">
<span style="font-weight: 700; font-size: 21px">{{m.title}}</span>
<span style="font-size: 17px; color: #44546D">{{m.detail}}</span>
</button>
</sc-for>
</div>

<div style="background: #E8EEFF; border-radius: 16px; padding: 14px 16px; font-size: 16px; line-height: 1.5; color: #1B2E55">Ravi does not need any app or account with us to receive money.</div>

</div>

<div style="flex: 0 0 auto; padding: 12px 20px 32px; background: #FFFFFF; border-top: 2px solid #E1E7F2">
<a class="cta" href="Review.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 64px; border-radius: 18px; background: #2F5BFF; color: #FFFFFF; font-weight: 700; font-size: 20px">Continue</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { method: this.sw.flow.method };
}
renderVals() {
const items = [
{ id: 'bank', title: 'Bank account', detail: 'Straight to Ravi\u2019s bank, ending 4821' },
{ id: 'wallet', title: 'Mobile wallet', detail: 'To the money app on Ravi\u2019s phone' },
{ id: 'cash', title: 'Cash pickup', detail: 'Ravi collects cash at a nearby location' }
];
return {
methods: items.map((m) => {
const on = m.id === this.state.method;
return {
title: m.title,
detail: m.detail,
bg: on ? '#E8EEFF' : '#FFFFFF',
border: on ? '#2F5BFF' : '#E1E7F2',
pick: () => { this.sw.flow.method = m.id; this.setState({ method: m.id }); }
};
})
};
}
}
</script>
</body>
</html>
