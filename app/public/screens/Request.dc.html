<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
input{font-family:inherit}
.cta:hover{background:#1D3FC0 !important}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F7FB; color: #0B1B33; font-family: Inter, system-ui, sans-serif; overflow: hidden">

<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Home.dc.html" aria-label="Back to home" style="width: 52px; height: 52px; border-radius: 16px; border: 2px solid #D5DCEB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B1B33" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
<span style="font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.02em">Ask for money</span>
</div>

<p style="margin: 0; font-size: 19px; line-height: 1.5; color: #44546D">We will send them a text with a link. They pay in a few taps, and the money arrives in your account.</p>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-weight: 600; font-size: 20px">Who are you asking?</span>
<div style="display: flex; gap: 12px">
<div style="flex: 1 1 0; min-width: 0; box-sizing: border-box; border: 3px solid #2F5BFF; background: #E8EEFF; border-radius: 20px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="width: 56px; height: 56px; border-radius: 50%; background: #FFE9D2; color: #9A3F00; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px">RK</span><span style="font-weight: 700; font-size: 18px">Ravi</span></div>
<div style="flex: 1 1 0; min-width: 0; box-sizing: border-box; border: 2px solid #E1E7F2; background: #FFFFFF; border-radius: 20px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="width: 56px; height: 56px; border-radius: 50%; background: #E2F5E7; color: #1F6B34; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px">MG</span><span style="font-weight: 600; font-size: 18px">Maria</span></div>
<div style="flex: 1 1 0; min-width: 0; box-sizing: border-box; border: 2px solid #E1E7F2; background: #FFFFFF; border-radius: 20px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="width: 56px; height: 56px; border-radius: 50%; background: #DDEBFF; color: #1E4F9A; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px">GL</span><span style="font-weight: 600; font-size: 18px">Grace</span></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<label for="req-amt" style="font-weight: 600; font-size: 20px">How much?</label>
<input id="req-amt" type="text" inputmode="decimal" value="150.00" style="box-sizing: border-box; height: 68px; border-radius: 16px; border: 2px solid #9AA8C2; background: #FFFFFF; padding: 0 18px; font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 30px; color: #0B1B33">
<span style="font-size: 16px; color: #44546D">In US dollars (USD)</span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<label for="req-note" style="font-weight: 600; font-size: 20px">Add a note (optional)</label>
<input id="req-note" type="text" placeholder="For example: for the family trip" style="box-sizing: border-box; height: 60px; border-radius: 16px; border: 2px solid #9AA8C2; background: #FFFFFF; padding: 0 18px; font-size: 18px; color: #0B1B33">
</div>

</div>

<div style="flex: 0 0 auto; padding: 12px 20px 32px; background: #FFFFFF; border-top: 2px solid #E1E7F2">
<a class="cta" href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 64px; border-radius: 18px; background: #2F5BFF; color: #FFFFFF; font-weight: 700; font-size: 20px">Send request by text</a>
</div>

</div>
