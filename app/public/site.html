<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swiftline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#2F5BFF;--pd:#1D3FC0;--dark:#0B1B33;--bg:#F5F7FB;--line:#E1E7F2;--mut:#55657E;--ok:#0B7A5A;--okbg:#E3F4EC;--warn:#9A3F00;--warnbg:#FFEBD6;--bad:#C0392B;--acc:#7FE3BC}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--dark)}
h1,h2,h3,.sg{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
header{background:var(--dark);color:#fff}
.bar{max-width:1160px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:"Space Grotesk";font-weight:700;font-size:22px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:8px 16px;border-radius:999px;font-size:15px;font-weight:500;color:#C5D0E4}
nav a.on{background:var(--p);color:#fff}nav a:hover:not(.on){background:#16294A}
.right{margin-left:auto;font-size:13px;color:#9DB6FF}
main{max-width:1160px;margin:0 auto;padding:28px 24px 60px}
.err{display:none;background:#FDE7E4;color:var(--bad);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}
.dark{background:var(--dark);color:#fff;border:0}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.split{display:grid;gap:18px;grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media(max-width:820px){.split{grid-template-columns:1fr}.bar{padding:12px 16px}main{padding:20px 16px 50px}}
h1{font-size:32px;margin:0 0 6px}h2{font-size:20px;margin:0 0 14px}
.mut{color:var(--mut);font-size:14px}.lab{font-size:13px;color:var(--mut);margin:14px 0 6px;display:block}
.big{font-family:"Space Grotesk";font-weight:700;font-size:40px;letter-spacing:-.02em}
input[type=text],input[type=number],select{width:100%;padding:13px 14px;border:1px solid #D5DCEB;border-radius:12px;font-size:16px;font-family:inherit;background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 16px;border-radius:999px;border:1px solid #D5DCEB;background:#fff;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.btn{background:var(--p);color:#fff;border:0;border-radius:14px;padding:14px 22px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--pd)}.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:#fff;color:var(--pd);border:1px solid #C7D3F5}.btn.ghost:hover{background:#EEF3FF}
.btn.bad{background:#fff;color:var(--bad);border:1px solid #F0C4BE}.btn.sm{padding:9px 14px;font-size:13px;border-radius:11px}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #EEF1F7;font-size:15px;align-items:center}
.row:last-child{border:0}.row b{font-weight:600}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;background:#E8EEFF;color:var(--pd)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.hold{background:var(--warnbg);color:#8A3A00}
.note{background:#E8EEFF;color:#1B2E55;border-radius:14px;padding:13px 16px;font-size:14px;line-height:1.5}
.warnnote{background:#FFF4E0;color:#6B3D00}
.steps{display:flex;gap:0;margin:14px 0 4px;flex-wrap:wrap}
.step{flex:1 1 120px;font-size:12px;color:var(--mut);text-align:center;position:relative;padding-top:30px}
.step:before{content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;border:3px solid #D5DCEB;background:#fff}
.step:after{content:"";position:absolute;top:11px;left:calc(50% + 14px);right:calc(-50% + 14px);height:2px;background:#D5DCEB}
.step:last-child:after{display:none}
.step.done:before{background:var(--ok);border-color:var(--ok)}.step.done:after{background:var(--ok)}
.step.act:before{border-color:var(--p)}.step.act{color:var(--pd);font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:#44546D;font-size:13px;background:var(--bg);padding:10px 14px}td{padding:13px 14px;border-top:1px solid #EEF1F7}
.tw{overflow-x:auto}.stat{font-family:"Space Grotesk";font-weight:700;font-size:32px}
code{background:#EEF2FA;padding:2px 7px;border-radius:6px;font-size:12px}
details{border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px;background:#fff}summary{cursor:pointer;font-size:15px}
</style></head><body>
<header><div class="bar">
<a class="logo" href="#dash"><svg width="30" height="30" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#16294A"/><path d="M9 21c4 0 5-10 9-10m0 0l-3-2m3 2l-2 3M23 11c-4 0-5 10-9 10m0 0l3 2m-3-2l2-3" fill="none" stroke="#7EA0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Swiftline</a>
<nav id="nav"></nav><span class="right">Demo on a local Canton ledger · <a href="/" style="text-decoration:underline">brief</a> · <a href="/#/Welcome" style="text-decoration:underline">phone design</a></span></div></header>
<main><div class="err" id="err"></div><div id="view"></div></main>
<script>
const $=s=>document.querySelector(s);
const fmt=(n,d=2)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=p=>String(p).split('::')[0].replace('swiftline_','').replace(/^./,c=>c.toUpperCase());
const PAGES=[['dash','Home'],['send','Send'],['activity','Activity'],['earn','Earn'],['privacy','Privacy'],['regulator','Regulator']];
const CORR=[{code:'INR',country:'India',rate:83},{code:'MXN',country:'Mexico',rate:17.1},{code:'PHP',country:'Philippines',rate:56.5},{code:'NGN',country:'Nigeria',rate:1500}];
const rd2=x=>Math.floor(x*100+1e-9)/100;
let V=null,busy=false,S={amount:'500',cur:'INR',hold:false,method:'bank',who:'sender',apr:'4',eamt:'100',notice:''};
async function api(p,b){const r=await fetch('/api/'+p,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
function err(m){const e=$('#err');e.textContent=m||'';e.style.display=m?'block':'none'}
async function act(fn){if(busy)return;busy=true;document.querySelectorAll('.btn').forEach(b=>b.disabled=true);let m='';try{err('');await fn()}catch(e){m=e.message}finally{busy=false;await draw();if(m)err(m)}}
const L=(r,n)=>((V&&V[r])||[]).filter(c=>c.name===n);
const freeUsd=()=>L('sender','Holding').filter(h=>String(h.args.owner).startsWith('swiftline_sender::')&&h.args.currency==='USD').reduce((a,h)=>a+Number(h.args.amount),0);
const staked=()=>L('sender','Stake').reduce((a,s)=>a+Number(s.args.principal),0);
const escrowed=()=>L('sender','RemitTransfer').reduce((a,t)=>a+Number(t.args.sendAmount),0);
const receipts=()=>L('sender','Receipt').slice().sort((a,b)=>new Date(b.args.settledAt)-new Date(a.args.settledAt));
const interest=s=>{const a=s.args,end=Math.min(Date.now(),new Date(a.maturesAt).getTime());return Number(a.principal)*Number(a.apr)*Math.max(0,end-new Date(a.startedAt).getTime())/(365*86400000)};
function nav(){const cur=(location.hash||'#dash').slice(1);$('#nav').innerHTML=PAGES.map(([k,l])=>`<a href="#${k}" id="nav-${k}" class="${cur===k?'on':''}">${l}</a>`).join('')}
function steps(done,act){const n=['Quote locked','Checks passed','Funds in escrow','Settling on Canton','Paid out'];return `<div class="steps">${n.map((t,i)=>`<div class="step ${i<done?'done':i===act?'act':''}">${t}</div>`).join('')}</div>`}
function rcpt(r){const a=r.args;return `<div class="row"><span>Sender</span><b>${esc(nm(a.sender))}</b></div><div class="row"><span>Recipient</span><b>${esc(nm(a.recipient))}</b></div><div class="row"><span>Paid out by</span><b>${esc(nm(a.provider))} (provider)</b></div><div class="row"><span>Amount sent</span><b>${fmt(a.sendAmount)} ${esc(a.fromCurrency)}</b></div><div class="row"><span>Fee</span><b>${fmt(a.fee)} ${esc(a.fromCurrency)}</b></div><div class="row"><span>Rate</span><b>1 ${esc(a.fromCurrency)} = ${Number(a.rate)} ${esc(a.toCurrency)}</b></div><div class="row"><span>Recipient received</span><b>${fmt(a.receiveAmount)} ${esc(a.toCurrency)}</b></div><div class="row"><span>Settled</span><b>${new Date(a.settledAt).toLocaleString()}</b></div><div class="row"><span>Receipt number</span><code>SW-${esc(r.cid.slice(0,10).toUpperCase())}</code></div>`}

async function draw(){
  nav();
  try{V=await api('views')}catch(e){err(e.message)}
  const page=(location.hash||'#dash').slice(1),v=$('#view');
  ({dash,send,activity,earn,privacy,regulator}[page]||dash)(v);
}
function dash(v){
  const rec=receipts(),esc_=L('sender','RemitTransfer');
  v.innerHTML=`<h1>Welcome back</h1><p class="mut" style="margin:0 0 20px">Your money, transfers and savings on one page.</p>
  <div class="grid g3" style="margin-bottom:18px">
   <div class="card dark"><div style="color:#C5D0E4;font-size:14px">Available</div><div class="big" id="bal">${fmt(freeUsd())} <span style="font-size:20px;color:#C5D0E4">USD</span></div></div>
   <div class="card"><div class="mut">Earning interest</div><div class="big" style="font-size:32px;color:var(--ok)">${fmt(staked())} USD</div></div>
   <div class="card"><div class="mut">In escrow</div><div class="big" style="font-size:32px">${fmt(escrowed())} USD</div></div></div>
  <div class="grid g2"><div class="card"><h2>Get started</h2><p class="mut" style="margin-top:0">Creates demo funds, a provider reserve and an identity check on the ledger. Safe to press again.</p>
   <button class="btn" id="setup">Set up demo data</button> <a class="btn ghost" href="#send" style="display:inline-block">Send money</a></div>
   <div class="card"><h2>Latest activity</h2>${esc_.length?esc_.slice(-2).reverse().map(t=>`<div class="row"><span>Sent to Ravi</span><span><span class="pill hold">In escrow</span> <b>${fmt(t.args.sendAmount)} USD</b></span></div>`).join(''):''}${rec.slice(0,3).map(r=>`<div class="row"><span>Sent to Ravi</span><span><span class="pill ok">Delivered</span> <b>${fmt(r.args.sendAmount)} USD</b></span></div>`).join('')||(esc_.length?'':'<p class="mut">Nothing yet.</p>')}</div></div>`;
  $('#setup').onclick=()=>act(async()=>{const r=await api('setup',{});S.notice=r.made.length?'Set up: '+r.made.join(', '):'Everything was already set up.'});
}
function send(v){
  const amt=parseFloat(String(S.amount).replace(/,/g,''))||0,c=CORR.find(x=>x.code===S.cur),fee=amt?rd2(Math.max(1.5,amt*0.006)):0,recv=rd2(Math.max(0,amt-fee)*c.rate);
  v.innerHTML=`<h1>Send money</h1><p class="mut" style="margin:0 0 20px">The rate and fee are locked for 10 minutes when you confirm.</p>
  <div class="split"><div class="card"><span class="lab" style="margin-top:0">You send (USD) · available ${fmt(freeUsd())}</span><input type="text" id="amt" inputmode="decimal" value="${esc(S.amount)}">
   <span class="lab">Where is the money going?</span><div class="chips">${CORR.map(x=>`<button class="chip ${x.code===S.cur?'on':''}" data-c="${x.code}">${x.code} · ${x.country}</button>`).join('')}</div>
   <span class="lab">Recipient</span><div class="row" style="border:1px solid var(--line);border-radius:14px;padding:12px 16px"><b>Ravi K.</b><span class="mut">Verified recipient</span></div>
   <span class="lab">How will Ravi get it?</span><select id="method"><option value="bank" ${S.method==='bank'?'selected':''}>Bank account ending 4821</option><option value="wallet" ${S.method==='wallet'?'selected':''}>Mobile wallet</option><option value="cash" ${S.method==='cash'?'selected':''}>Cash pickup</option></select>
   <label style="display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px;color:var(--mut)"><input type="checkbox" id="hold" ${S.hold?'checked':''} style="margin-top:3px"> Hold in escrow so I can act as the provider on the Activity page (to settle, reject or cancel)</label>
   <button class="btn" id="go" style="margin-top:18px">Confirm and send ${fmt(amt)} USD</button></div>
  <div class="card dark" style="align-self:start"><div style="color:#B8C4DA;font-size:14px">Recipient gets</div><div class="big" id="recv" style="color:var(--acc)">${fmt(recv)} <span style="font-size:20px">${c.code}</span></div>
   <div style="margin-top:14px;font-size:14px"><div class="row" style="border-color:#1E3157"><span style="color:#B8C4DA">Rate</span><b>1 USD = ${fmt(c.rate)} ${c.code}</b></div><div class="row" style="border-color:#1E3157"><span style="color:#B8C4DA">Fee</span><b>${fmt(fee)} USD</b></div><div class="row" style="border:0"><span style="color:#B8C4DA">Total taken</span><b>${fmt(amt)} USD</b></div></div>
   <div style="background:#16294A;border-radius:12px;padding:12px 14px;font-size:13px;color:#C5D0E4;margin-top:8px">Checked before settlement: identity verified, within your transfer limit, recipient screening.</div></div></div>`;
  const redraw=()=>{S.amount=$('#amt').value;S.method=$('#method').value;S.hold=$('#hold').checked;const pos=$('#amt').selectionStart;send(v);const e=$('#amt');e.focus();e.setSelectionRange(pos,pos)};
  $('#amt').oninput=redraw;$('#method').onchange=()=>{S.method=$('#method').value};$('#hold').onchange=()=>{S.hold=$('#hold').checked};
  v.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.amount=$('#amt').value;S.cur=b.dataset.c;send(v)});
  $('#go').onclick=()=>act(async()=>{S.amount=$('#amt').value;S.hold=$('#hold').checked;const {quote}=await api('quote',{amount:amt,currency:S.cur});const a=await api('accept',{quoteCid:quote.cid,amount:amt});S.last=a.transfer.cid;
    if(!S.hold){await new Promise(r=>setTimeout(r,1200));await api('settle',{transferCid:a.transfer.cid})}S.notice=S.hold?'Transfer is in escrow. Settle, reject or cancel it below.':'Delivered. Your receipt is below.';location.hash='#activity'});
}
function activity(v){
  const esc_=L('provider','RemitTransfer'),rec=receipts();
  v.innerHTML=`<h1>Activity</h1><p class="mut" style="margin:0 0 16px">Transfers in progress and your receipts.</p>${S.notice?`<div class="note" style="margin-bottom:16px">${esc(S.notice)}</div>`:''}
  <div class="card" style="margin-bottom:18px"><h2>In progress</h2>${esc_.length?esc_.map(t=>{const a=t.args;return `<div style="border-bottom:1px solid #EEF1F7;padding:6px 0 16px"><div class="row" style="border:0"><span><b>${fmt(a.sendAmount)} USD → ${fmt(a.receiveAmount)} ${esc(a.toCurrency)}</b><br><span class="mut">to Ravi K. · due ${new Date(a.settleBy).toLocaleString()}</span></span><span class="pill hold">In escrow</span></div>${steps(3,3)}
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="btn sm" data-a="settle" data-c="${t.cid}">Settle (provider)</button><button class="btn bad sm" data-a="reject" data-c="${t.cid}">Reject and refund (provider)</button><button class="btn ghost sm" data-a="cancel" data-c="${t.cid}">Cancel after deadline (sender)</button></div></div>`}).join(''):'<p class="mut">Nothing in escrow. Send money with the hold option ticked to see one here.</p>'}</div>
  <div class="card"><h2>Receipts</h2>${rec.length?rec.map((r,i)=>`<details ${i===0&&S.notice.startsWith('Delivered')?'open':''}><summary><b>${fmt(r.args.sendAmount)} ${esc(r.args.fromCurrency)} → ${fmt(r.args.receiveAmount)} ${esc(r.args.toCurrency)}</b> <span class="pill ok" style="margin-left:8px">Delivered</span> <span class="mut" style="margin-left:8px">${new Date(r.args.settledAt).toLocaleString()}</span></summary><div style="margin-top:8px">${rcpt(r)}</div></details>`).join(''):'<p class="mut">No receipts yet.</p>'}</div>`;
  v.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>act(async()=>{S.notice='';const a=b.dataset.a;await api(a,{transferCid:b.dataset.c});S.notice=a==='settle'?'Delivered. Your receipt is below.':a==='reject'?'Rejected. The money went back to the sender.':'Cancelled. The money went back to the sender.'}));
}
function earn(v){
  const st=L('sender','Stake');const apr=parseFloat(S.apr)||0,amt=parseFloat(S.eamt)||0;
  v.innerHTML=`<h1>Earn interest</h1><p class="mut" style="margin:0 0 20px;max-width:640px">Lock some of your money and it grows over time. The provider pays the interest from its reserve.</p>
  <div class="split"><div class="card"><span class="lab" style="margin-top:0">Amount to lock (USD) · available ${fmt(freeUsd())}</span><div class="chips" style="margin-bottom:10px">${[100,250,500,1000].map(x=>`<button class="chip ${amt===x?'on':''}" data-amt="${x}">${fmt(x)} USD</button>`).join('')}</div><input type="text" inputmode="decimal" id="eamt" value="${esc(S.eamt)}">
   <span class="lab">Yearly rate (%)</span><input type="text" inputmode="decimal" id="eapr" value="${esc(S.apr)}"><div class="mut" style="margin-top:6px;font-size:13px">4% matches the design. Use 10000000 for a fast demo, because a real rate earns under a cent in seconds. This is the rate the provider offers.</div>
   <div class="row" style="margin-top:10px"><span>In one year you could earn about</span><b style="color:var(--ok)">${fmt(amt*apr/100)} USD</b></div>
   <button class="btn" id="stake">Start earning on ${fmt(amt)} USD</button></div>
  <div class="card dark" style="align-self:start"><div style="color:#C5D0E4;font-size:14px">Earning right now</div><div class="big">${fmt(staked())} USD</div><div style="color:var(--acc);font-weight:600;margin-top:6px">Interest so far: ${fmt(st.reduce((a,s)=>a+interest(s),0))} USD</div></div></div>
  <div class="note warnnote" style="margin:18px 0">Rates can go up or down and interest is not guaranteed. Offering returns to consumers may be a regulated product. These values are placeholders.</div>
  <div class="card"><h2>Your stakes</h2>${st.length?st.map(s=>`<div class="row" style="flex-wrap:wrap"><span><b>${fmt(s.args.principal)} USD</b><br><span class="mut">rate ${fmt(Number(s.args.apr)*100)}% · matures ${new Date(s.args.maturesAt).toLocaleString()} · interest so far ${fmt(interest(s))} USD</span></span><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-a="earn/redeem" data-c="${s.cid}">Redeem now (provider pays interest)</button><button class="btn ghost sm" data-a="earn/claim" data-c="${s.cid}">Claim principal (after maturity)</button></span></div>`).join(''):'<p class="mut">No active stakes.</p>'}</div>`;
  const keep=()=>{S.eamt=$('#eamt').value;S.apr=$('#eapr').value};
  $('#eamt').oninput=()=>{keep();const p=$('#eamt').selectionStart;earn(v);$('#eamt').focus();$('#eamt').setSelectionRange(p,p)};
  $('#eapr').oninput=()=>{keep();const p=$('#eapr').selectionStart;earn(v);$('#eapr').focus();$('#eapr').setSelectionRange(p,p)};
  v.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{keep();S.eamt=b.dataset.amt;earn(v)});
  $('#stake').onclick=()=>act(async()=>{keep();await api('earn/start',{amount:amt,apr:apr/100,lockDays:30})});
  v.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>act(async()=>{await api(b.dataset.a,{stakeCid:b.dataset.c})}));
}
function privacy(v){
  const roles=['sender','recipient','provider','regulator','issuer','outsider'],list=(V&&V[S.who])||[],cnt={};list.forEach(c=>cnt[c.name]=(cnt[c.name]||0)+1);
  v.innerHTML=`<h1>Who can see what</h1><p class="mut" style="margin:0 0 16px;max-width:680px">Each tab asks the ledger for contracts as that one party. A recipient or outsider should see far less than the provider.</p>
  <div class="tabs">${roles.map(r=>`<button class="chip ${S.who===r?'on':''}" data-r="${r}">${r}</button>`).join('')}</div>
  <div class="card"><div class="row"><span>Contracts visible to ${S.who}</span><b id="count" class="sg" style="font-size:24px">${list.length}</b></div>${Object.entries(cnt).map(([k,n])=>`<div class="row"><span>${k}</span><b>${n}</b></div>`).join('')||'<p class="mut">Nothing visible.</p>'}
  ${list.filter(c=>c.name==='Holding').map(h=>`<div class="row"><span class="mut">Holding owned by ${esc(nm(h.args.owner))}</span><span>${fmt(h.args.amount)} ${esc(h.args.currency)}</span></div>`).join('')}</div>
  <div class="note" style="margin-top:16px">In this demo all parties sit on one participant node and one admin token acts for them, so this view shows what the contracts allow each party to see. It does not show separation across separate nodes.</div>`;
  v.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.who=b.dataset.r;privacy(v)});
}
function regulator(v){
  const recs=L('regulator','Receipt').slice().sort((a,b)=>new Date(b.args.settledAt)-new Date(a.args.settledAt)),held=L('regulator','RemitTransfer');
  const rows=held.map(t=>[t,'In escrow','Awaiting settlement','hold']).concat(recs.map(r=>[r,'Settled','All checks passed','ok']));
  v.innerHTML=`<h1>Regulator view</h1><p class="mut" style="margin:0 0 20px;max-width:720px">Read as the regulator party. It can see amounts, corridors and check results, and cannot move money or change a transfer.</p>
  <div class="grid g3" style="margin-bottom:18px"><div class="card"><div class="mut">Transfers</div><div class="stat" id="nt">${rows.length}</div></div><div class="card"><div class="mut">Settled</div><div class="stat" style="color:var(--ok)">${recs.length}</div></div><div class="card"><div class="mut">In escrow</div><div class="stat" style="color:var(--warn)">${held.length}</div></div></div>
  <div class="card" style="padding:0;overflow:hidden"><div style="padding:18px 22px;font-weight:600">Recent transfers <span class="mut" style="font-weight:400">· live from the ledger</span></div><div class="tw"><table><tr><th>Reference</th><th>Corridor</th><th>Amount</th><th>Status</th><th>Check result</th></tr>${rows.length?rows.slice(0,15).map(([c,s,k,t])=>`<tr><td><b>SW-${esc(c.cid.slice(0,8).toUpperCase())}</b></td><td>${esc(c.args.fromCurrency)} to ${esc(c.args.toCurrency)}</td><td>${fmt(c.args.sendAmount)} ${esc(c.args.fromCurrency)}</td><td><span class="pill ${t}">${s}</span></td><td class="mut">${k}</td></tr>`).join(''):'<tr><td colspan="5" class="mut">No transfers yet.</td></tr>'}</table></div></div>`;
}
window.addEventListener('hashchange',()=>{err('');draw()});draw();
</script></body></html>
