<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swiftline home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.tile:hover{background:#EEF2FB !important}
.cta:hover{background:#1D3FC0 !important}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F7FB; color: #0B1B33; font-family: Inter, system-ui, sans-serif; overflow: hidden">

<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.02em">Hello</span>
<a href="Welcome.dc.html" style="min-height: 48px; padding: 0 18px; border-radius: 14px; border: 2px solid #D5DCEB; background: #FFFFFF; display: inline-flex; align-items: center; font-weight: 600; font-size: 17px">Help</a>
</div>

<div style="background: #0B1B33; color: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 18px; color: #C5D0E4">You have</span>
<span style="font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 44px; letter-spacing: -0.02em">{{totalText}} <span style="font-size: 22px; color: #C5D0E4">USD</span></span>
<span style="font-size: 16px; color: #7FE3BC; font-weight: 600">{{earningText}}</span>
</div>

<a class="cta" href="Send.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 68px; border-radius: 18px; background: #2F5BFF; color: #FFFFFF; font-weight: 700; font-size: 22px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Send money</a>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<a class="tile" href="Request.dc.html" style="min-height: 112px; box-sizing: border-box; background: #FFFFFF; border: 2px solid #E1E7F2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1D3FC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span style="font-weight: 600; font-size: 19px">Ask for money</span></a>
<a class="tile" href="Earn.dc.html" style="min-height: 112px; box-sizing: border-box; background: #FFFFFF; border: 2px solid #E1E7F2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0B7A5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18l6-6 4 4 6-8"/><path d="M15 8h5v5"/></svg><span style="font-weight: 600; font-size: 19px">Earn interest</span></a>
<a class="tile" href="Recurring.dc.html" style="min-height: 112px; box-sizing: border-box; background: #FFFFFF; border: 2px solid #E1E7F2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1D3FC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2"/><path d="M20 4v5h-5M4 20v-5h5"/></svg><span style="font-weight: 600; font-size: 19px">Repeat sends</span></a>
<a class="tile" href="Alerts.dc.html" style="min-height: 112px; box-sizing: border-box; background: #FFFFFF; border: 2px solid #E1E7F2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#9A3F00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span style="font-weight: 600; font-size: 19px">Rate alerts</span></a>
<a class="tile" href="Receipt.dc.html" style="min-height: 112px; box-sizing: border-box; background: #FFFFFF; border: 2px solid #E1E7F2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1D3FC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span style="font-weight: 600; font-size: 19px">My receipts</span></a>
<a class="tile" href="Wallet.dc.html" style="min-height: 112px; box-sizing: border-box; background: #FFFFFF; border: 2px solid #E1E7F2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1D3FC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12h2"/></svg><span style="font-weight: 600; font-size: 19px">My money</span></a>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-weight: 600; font-size: 20px">Latest</span>
<a href="Track.dc.html" style="background: #FFFFFF; border: 2px solid #E1E7F2; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 14px">
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 19px">{{latestTitle}}</span><span style="font-size: 16px; color: #44546D">{{latestSub}}</span></div>
<span style="font-weight: 700; font-size: 19px">{{latestAmt}}</span>
</a>
</div>

</div>

<div style="flex: 0 0 auto; display: flex; justify-content: space-around; align-items: center; padding: 8px 12px 28px; background: #FFFFFF; border-top: 2px solid #E1E7F2">
<a href="Home.dc.html" style="min-width: 64px; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 14px; font-weight: 700; color: #2F5BFF"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2F5BFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>Home</a>
<a href="Send.dc.html" style="min-width: 64px; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 14px; font-weight: 500; color: #44546D"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#44546D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Send</a>
<a href="Earn.dc.html" style="min-width: 64px; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 14px; font-weight: 500; color: #44546D"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#44546D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18l6-6 4 4 6-8"/><path d="M15 8h5v5"/></svg>Earn</a>
<a href="Wallet.dc.html" style="min-width: 64px; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 14px; font-weight: 500; color: #44546D"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#44546D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12h2"/></svg>Money</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
async load() { await this.sw.refresh(); }
renderVals() {
const sw = this.sw; const fmt = sw.fmt;
const staked = sw.stakedUsd();
const esc = sw.escrow();
const rec = sw.receipts();
let t = 'No transfers yet', sub = 'Send your first one', amt = '';
if (esc.length) { const x = esc[esc.length - 1].args; t = 'Sent to Ravi'; sub = 'On its way'; amt = fmt(x.sendAmount) + ' USD'; }
else if (rec.length) { const x = rec[0].args; t = 'Sent to Ravi'; sub = 'Delivered'; amt = fmt(x.sendAmount) + ' USD'; }
return {
totalText: fmt(sw.freeUsd() + staked),
earningText: fmt(staked) + ' USD is earning interest',
latestTitle: t, latestSub: sub, latestAmt: amt
};
}
}
</script>
</body>
</html>
